# picom config for the cyberpunk awesome setup
# Needs picom >= 10 for corner-radius. Put this file next to rc.lua.

backend = "glx";
vsync = true;

# ---- rounded corners + stroke (hyprland look) -------------------------
# awesome draws the 2px neon border, picom rounds the window AND its border.
# 0 = sharp Edgerunners edges. Set 12 to get rounded corners back.
corner-radius = 0;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---- neon glow --------------------------------------------------------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.30;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "#fcee0a";
shadow-exclude = [
  "class_i *= 'awesome-videowall'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Flameshot'",
  "class_g = 'scrot'"
];

# ---- smooth transitions (fade in/out) ---------------------------------
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

# ---- blur behind transparent things (terminal, bar) -------------------
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'flameshot'",
  "class_g = 'Flameshot'",
  "class_g = 'Spectacle'",
  "name = 'slop'",
  "window_type = 'desktop'"
];

opacity-rule = [
  "80:class_g = 'kitty'"
];

detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};

# ---- real animations: picom >= 12 only (check `picom --version`) ------
# Uncomment for windows that slide/zoom in and glide when tiling moves them.
# If picom refuses to start after uncommenting, your version is too old.
#
animations = (
 { triggers = ["open", "show"];    preset = "appear";          duration = 0.18; },
 { triggers = ["close", "hide"];   preset = "disappear";       duration = 0.15; },
 { triggers = ["geometry"];        preset = "geometry-change"; duration = 0.18; }
);
